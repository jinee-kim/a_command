<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 장르 메뉴 & 게임 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1d1d;
    --muted: #8a8a8a;
    --line: #ececec;
    --chip-bg: #f3f4f6;
    --accent: #2f7bff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --line: #2a2a2a;
      --chip-bg: #1f1f1f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --fg: #f2f2f2; --muted: #9a9a9a; --line: #2a2a2a; --chip-bg: #1f1f1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---------- 상단 장르 메뉴 (네이버 스타일 아이콘 줄) ---------- */
  .genres {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 12px 4px 14px;
    scrollbar-width: none;
    border-bottom: 1px solid var(--line);
  }
  .genres::-webkit-scrollbar { display: none; }

  .genre {
    flex: 0 0 auto;
    width: 62px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border: 0;
    background: none;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 4px 0;
    border-radius: 12px;
    cursor: pointer;
    transition: background .2s ease;
  }
  .genre:hover { background: var(--chip-bg); }
  .genre:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .genre[aria-selected="true"] .label { font-weight: 700; }
  .genre[aria-selected="true"] .ico { box-shadow: 0 0 0 2px var(--accent); }

  .ico {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: var(--bg);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .ico svg { width: 30px; height: 30px; }

  /* ---------- 리스트 ---------- */
  .list { list-style: none; }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
  }
  .thumb {
    flex: 0 0 56px;
    height: 56px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
  }
  .meta { flex: 1; min-width: 0; }
  .meta strong { display: block; font-size: 16px; font-weight: 500; }
  .meta span { font-size: 13px; color: var(--muted); }
  .tag { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); display: none; }

  @media (max-width: 480px) {
    .genre { width: 58px; }
    .ico { width: 48px; height: 48px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="genres" role="tablist" aria-label="게임 장르">
    <button class="genre" role="tab" aria-selected="true" data-cat="전체">
      <span class="ico"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="10" height="10" rx="2" fill="#2f7bff"/><rect x="17" y="5" width="10" height="10" rx="2" fill="#2f7bff"/><rect x="5" y="17" width="10" height="10" rx="2" fill="#2f7bff"/><rect x="17" y="17" width="10" height="10" rx="2" fill="#2f7bff"/></svg></span>
      <span class="label">전체</span>
    </button>
    <button class="genre" role="tab" aria-selected="false" data-cat="액션">
      <span class="ico"><svg viewBox="0 0 32 32"><path d="M18 3L7 18h8l-2 11 12-16h-8z" fill="#ef4444"/></svg></span>
      <span class="label">액션</span>
    </button>
    <button class="genre" role="tab" aria-selected="false" data-cat="슈팅">
      <span class="ico"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#0ea5e9" stroke-width="2.5"/><circle cx="16" cy="16" r="3" fill="#0ea5e9"/><path d="M16 2v6M16 24v6M2 16h6M24 16h6" stroke="#0ea5e9" stroke-width="2.5"/></svg></span>
      <span class="label">슈팅</span>
    </button>
    <button class="genre" role="tab" aria-selected="false" data-cat="어드벤쳐">
      <span class="ico"><svg viewBox="0 0 32 32"><path d="M3 27L13 9l5 9 3-5 8 14z" fill="#a16207"/><path d="M13 9l-2 3" stroke="#fff" stroke-width="1.5"/></svg></span>
      <span class="label">어드벤쳐</span>
    </button>
    <button class="genre" role="tab" aria-selected="false" data-cat="퍼즐">
      <span class="ico"><svg viewBox="0 0 32 32"><path d="M5 9h7a3 3 0 1 1 6 0h9v7a3 3 0 1 1 0 6v5H5z" fill="#8b5cf6"/></svg></span>
      <span class="label">퍼즐</span>
    </button>
    <button class="genre" role="tab" aria-selected="false" data-cat="아케이드">
      <span class="ico"><svg viewBox="0 0 32 32"><rect x="4" y="18" width="24" height="8" rx="3" fill="#f59e0b"/><path d="M12 18V8" stroke="#f59e0b" stroke-width="3"/><circle cx="12" cy="6" r="4" fill="#f59e0b"/><circle cx="23" cy="20" r="2" fill="#fff"/></svg></span>
      <span class="label">아케이드</span>
    </button>
  </nav>

  <ul class="list" id="list">
    <li class="item" data-cat="액션"><div class="thumb" style="background:#ef4444">A</div><div class="meta"><strong>블레이드 러쉬</strong><span>연속 콤보 액션</span></div><span class="tag">액션</span></li>
    <li class="item" data-cat="슈팅"><div class="thumb" style="background:#0ea5e9">S</div><div class="meta"><strong>스타 가디언</strong><span>우주 횡스크롤 슈팅</span></div><span class="tag">슈팅</span></li>
    <li class="item" data-cat="어드벤쳐"><div class="thumb" style="background:#a16207">D</div><div class="meta"><strong>잊혀진 유적</strong><span>탐험과 수수께끼</span></div><span class="tag">어드벤쳐</span></li>
    <li class="item" data-cat="퍼즐"><div class="thumb" style="background:#8b5cf6">P</div><div class="meta"><strong>컬러 매치</strong><span>블록 맞추기 퍼즐</span></div><span class="tag">퍼즐</span></li>
    <li class="item" data-cat="아케이드"><div class="thumb" style="background:#f59e0b">R</div><div class="meta"><strong>네온 런</strong><span>무한 달리기</span></div><span class="tag">아케이드</span></li>
    <li class="item" data-cat="액션"><div class="thumb" style="background:#dc2626">F</div><div class="meta"><strong>파이터 아레나</strong><span>1:1 대전 격투</span></div><span class="tag">액션</span></li>
    <li class="item" data-cat="슈팅"><div class="thumb" style="background:#14b8a6">B</div><div class="meta"><strong>버블 샷</strong><span>조준 후 발사 슈팅</span></div><span class="tag">슈팅</span></li>
    <li class="item" data-cat="퍼즐"><div class="thumb" style="background:#6366f1">W</div><div class="meta"><strong>워드 로직</strong><span>단어 조합 퍼즐</span></div><span class="tag">퍼즐</span></li>
  </ul>
  <p class="empty" id="empty">해당 장르의 게임이 없습니다.</p>

</div>

<script>
  const genres = document.querySelectorAll('.genre');
  const items = document.querySelectorAll('#list .item');
  const empty = document.getElementById('empty');

  function applyFilter(cat) {
    let shown = 0;
    items.forEach(li => {
      const match = cat === '전체' || li.dataset.cat === cat;
      li.hidden = !match;
      if (match) shown++;
    });
    empty.style.display = shown === 0 ? 'block' : 'none';
  }

  genres.forEach(btn => {
    btn.addEventListener('click', () => {
      genres.forEach(b => b.setAttribute('aria-selected', 'false'));
      btn.setAttribute('aria-selected', 'true');
      applyFilter(btn.dataset.cat);
    });
  });
</script>
</body>
</html>
